<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>斐伊川3択クイズ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#17202a}.wrap{max-width:760px;margin:auto;padding:12px}.head{background:#315b88;color:#fff;border-radius:14px;padding:18px;margin-bottom:12px}.head h1{font-size:20px;margin:0 0 6px}.card{background:#fff;border:1px solid #d5d8dc;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}.start{text-align:center;padding:24px 18px}.start h2{margin-top:0}.nameBox{text-align:left;max-width:420px;margin:0 auto 14px}.nameBox label{display:block;font-size:13px;color:#5d6d7e;margin-bottom:5px;font-weight:700}.nameBox input{width:100%;padding:13px 14px;border:1px solid #cfd6dc;border-radius:10px;font-size:17px;background:#fff}.modeBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 auto}.primary,.secondary{border:0;border-radius:12px;padding:14px 18px;font-weight:800;font-size:16px}.primary{background:#315b88;color:#fff}.secondary{background:#eef3f8;color:#315b88;border:1px solid #b8c8d8}.secondary:disabled{opacity:.45}.wrongInfo{font-size:13px;color:#5d6d7e;margin:10px 0 0}.history{max-width:520px;margin:18px auto 0;text-align:left}.historyTitle{font-weight:800;margin-bottom:6px}.histHead,.histRow{display:grid;grid-template-columns:1.4fr .8fr .8fr .8fr;gap:6px;padding:7px 3px;border-bottom:1px solid #e4e7ea;font-size:12px}.histHead{color:#7b8793;font-weight:700}.top{display:flex;justify-content:space-between;color:#5d6d7e;font-size:14px}.timer{font-weight:800;font-variant-numeric:tabular-nums}.timer.warn{color:#c0392b}.prog{height:8px;background:#e5e7e9;border-radius:99px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:#315b88;width:0}.question{font-size:19px;font-weight:700;line-height:1.5;margin-bottom:14px}.images{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.images img{width:100%;max-height:320px;object-fit:contain;border-radius:10px;border:1px solid #ddd;background:#fafafa}.choices{display:grid;gap:10px}.choice{padding:14px;border:1px solid #d5d8dc;border-radius:10px;background:#fff;text-align:left;font-size:16px}.choice.correct{background:#eaf7ef;border-color:#1e8449}.choice.wrong{background:#fdecea;border-color:#c0392b}.feedback{display:none;margin-top:12px;padding:11px;border-radius:10px;line-height:1.5}.feedback.ok{display:block;background:#eaf7ef}.feedback.ng{display:block;background:#fdecea}.source{font-size:12px;color:#5d6d7e;margin-top:6px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}.next,.back,.quit{border:0;border-radius:10px;padding:11px 14px;font-weight:700}.next{background:#315b88;color:#fff}.back{background:#e5e7e9;color:#17202a}.quit{background:#fff0ef;color:#a93226;border:1px solid #e6b0aa}.result{display:none;text-align:center}.score{font-size:42px;font-weight:800}.resultMeta{margin:8px 0 16px}.metrics{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:14px}.metrics span{background:#f4f6f8;padding:8px 10px;border-radius:9px}.review{text-align:left;margin-top:18px}.row{display:grid;grid-template-columns:42px 42px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #ddd}.mark{font-size:22px;font-weight:800;text-align:center}.mark.ok{color:#1e8449}.mark.ng{color:#c0392b}.resultActions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.note{font-size:12px;color:#7b8793;margin-top:12px}@media(max-width:560px){.images{grid-template-columns:1fr}.question{font-size:17px}.choice{font-size:15px}.next,.back,.quit{padding:10px 11px}.modeBtns{grid-template-columns:1fr}.histHead,.histRow{grid-template-columns:1.35fr .75fr .75fr .75fr;font-size:11px}}
</style></head><body><div class="wrap"><div class="head"><h1>令和8年度斐伊川河道掘削工事　3択クイズ</h1><div>設計図書・工事情報ベース／全50問／制限時間5分</div></div><div class="card start" id="start"><h2>名前を入力して開始</h2><div class="nameBox"><label for="playerName">名前</label><input id="playerName" maxlength="30" autocomplete="name" placeholder="例：太田"></div><div class="modeBtns"><button class="primary" id="startBtn">全50問スタート</button><button class="secondary" id="retryWrongStart" disabled>間違えた問題だけ解く</button></div><div class="wrongInfo" id="wrongInfo"></div><div class="history" id="history"></div><div class="note">結果はこの端末・このブラウザ内に保存されます。</div></div><div class="card" id="quiz" style="display:none"><div class="top"><span id="counter"></span><span class="timer" id="timer">05:00</span><span id="scoreMini"></span></div><div class="prog"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="images" id="images" style="display:none"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="back" id="back" style="visibility:hidden">← 戻る</button><button class="quit" id="quit">途中終了</button><button class="next" id="next" style="display:none">次の問題</button></div></div><div class="card result" id="result"><h2>結果</h2><div class="score" id="finalScore"></div><div class="resultMeta" id="resultMeta"></div><p id="comment"></p><div class="review" id="review"></div><div class="resultActions"><button class="secondary" id="retryWrongResult" disabled>間違えた問題だけ解く</button><button class="primary" id="restart">トップへ戻る</button></div></div></div><script src="app.js"></script><script src="extra20.js"></script><script src="back.js"></script><script src="stats.js"></script></body></html>
