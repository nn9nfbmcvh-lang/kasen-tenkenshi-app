<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>斐伊川3択クイズ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#17202a}.wrap{max-width:760px;margin:auto;padding:12px}.head{background:#315b88;color:#fff;border-radius:14px;padding:18px;margin-bottom:12px}.head h1{font-size:20px;margin:0 0 6px}.card{background:#fff;border:1px solid #d5d8dc;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}.start{text-align:center;padding:28px 18px}.start h2{margin-top:0}.primary{border:0;border-radius:12px;padding:14px 24px;background:#315b88;color:#fff;font-weight:800;font-size:18px}.top{display:flex;justify-content:space-between;color:#5d6d7e;font-size:14px}.timer{font-weight:800;font-variant-numeric:tabular-nums}.timer.warn{color:#c0392b}.prog{height:8px;background:#e5e7e9;border-radius:99px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:#315b88;width:0}.question{font-size:19px;font-weight:700;line-height:1.5;margin-bottom:14px}.images{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.images img{width:100%;max-height:320px;object-fit:contain;border-radius:10px;border:1px solid #ddd;background:#fafafa}.choices{display:grid;gap:10px}.choice{padding:14px;border:1px solid #d5d8dc;border-radius:10px;background:#fff;text-align:left;font-size:16px}.choice.correct{background:#eaf7ef;border-color:#1e8449}.choice.wrong{background:#fdecea;border-color:#c0392b}.feedback{display:none;margin-top:12px;padding:11px;border-radius:10px;line-height:1.5}.feedback.ok{display:block;background:#eaf7ef}.feedback.ng{display:block;background:#fdecea}.source{font-size:12px;color:#5d6d7e;margin-top:6px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}.next,.back,.quit{border:0;border-radius:10px;padding:11px 14px;font-weight:700}.next{background:#315b88;color:#fff}.back{background:#e5e7e9;color:#17202a}.quit{background:#fff0ef;color:#a93226;border:1px solid #e6b0aa}.result{display:none;text-align:center}.score{font-size:42px;font-weight:800}.review{text-align:left;margin-top:18px}.row{display:grid;grid-template-columns:42px 42px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #ddd}.mark{font-size:22px;font-weight:800;text-align:center}.mark.ok{color:#1e8449}.mark.ng{color:#c0392b}@media(max-width:560px){.images{grid-template-columns:1fr}.question{font-size:17px}.choice{font-size:15px}.next,.back,.quit{padding:10px 11px}}
</style></head><body><div class="wrap"><div class="head"><h1>令和8年度斐伊川河道掘削工事　3択クイズ</h1><div>設計図書・工事情報ベース／全30問／制限時間5分</div></div><div class="card start" id="start"><h2>準備ができたら開始</h2><p>スタートを押すと5分のタイマーが開始します。</p><button class="primary" id="startBtn">スタート</button></div><div class="card" id="quiz" style="display:none"><div class="top"><span id="counter"></span><span class="timer" id="timer">05:00</span><span id="scoreMini"></span></div><div class="prog"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="images" id="images" style="display:none"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="back" id="back" style="visibility:hidden">← 戻る</button><button class="quit" id="quit">途中終了</button><button class="next" id="next" style="display:none">次の問題</button></div></div><div class="card result" id="result"><h2>結果</h2><div class="score" id="finalScore"></div><p id="comment"></p><div class="review" id="review"></div><button class="primary" id="restart">もう一度</button></div></div><script src="app.js"></script><script src="back.js"></script></body></html>
