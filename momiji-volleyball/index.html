<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>もみじ杯ママさんバレーボール大会 参加申込書</title><style>*{box-sizing:border-box}body{margin:0;background:#eee;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif}.wrap{max-width:760px;margin:auto;padding:8px}.paper{background:#fff;border:1px solid #bbb;border-radius:16px;padding:28px 30px 42px}h1{text-align:center;font-size:27px;line-height:1.55;margin:10px 0 34px}.r{display:grid;grid-template-columns:230px 1fr;align-items:end;margin:7px 0;font-size:19px}.r span{text-align:right;padding-right:10px}.line{width:100%;border:0;border-bottom:1px solid #333;background:transparent;font:inherit;padding:4px 6px}.note{font-size:18px;font-weight:700;line-height:1.7;margin:22px 0 14px}table{width:100%;border-collapse:collapse}th,td{border:1.5px solid #222;padding:8px;font-size:18px;text-align:center}input.txt{width:100%;border:0;background:transparent;text-align:center;font:inherit;outline:none}.cat td{height:64px}.opts{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}.opts label{display:flex;align-items:center;gap:6px}.opts input{width:21px;height:21px}.meta th,.meta td{height:58px}.players{margin-top:22px}.players th:nth-child(1){width:20%}.players th:nth-child(2){width:50%}.players th:nth-child(3){width:30%}.players td{height:62px}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}.actions button{border:0;border-radius:10px;background:#222;color:#fff;font-weight:700;font-size:16px;padding:12px 15px}.actions button.alt{background:#666}.share{display:none;background:#fff;border-radius:12px;padding:14px;margin:0 auto 18px;max-width:760px}.share input{width:100%;padding:10px;border:1px solid #aaa;border-radius:8px}.qr{text-align:center;margin:12px 0}.qr img{width:230px;height:230px;max-width:80vw;max-height:80vw}.small{font-size:13px;line-height:1.6;color:#555}@media(max-width:620px){.paper{padding:20px 12px 30px;border-radius:8px}h1{font-size:20px;margin-bottom:22px}.r{grid-template-columns:145px 1fr;font-size:15px}.note{font-size:14px}.opts{gap:10px}th,td{font-size:14px;padding:6px 4px}.meta th,.meta td{height:52px}.players td{height:50px}.players input{font-size:15px}}@media print{body{background:#fff}.wrap{max-width:none}.paper{border:0;border-radius:0}.actions,.share{display:none!important}}</style></head><body><div class="wrap"><div class="paper"><h1>もみじ杯ママさんバレーボール大会 参加申込書</h1><div class="r"><span>申込責任者 住所：</span><input id="address" class="line"></div><div class="r"><span>氏名：</span><input id="responsible" class="line"></div><div class="r"><span>電話：</span><input id="phone" class="line" inputmode="tel"></div><div class="note">＊キャプテンは一番最初に記入してください。<br>＊背番号は番号の小さい順からお書きください。</div><table class="cat"><tr><th style="width:20%">カテゴリー</th><td><div class="opts"><label><input type="radio" name="category" value="一般" checked>一般</label><label><input type="radio" name="category" value="いそじ">いそじ</label><label><input type="radio" name="category" value="ことぶき">ことぶき</label></div></td></tr></table><table class="meta"><tr><th>チーム名</th><td><input id="team" class="txt"></td><th>監督</th><td><input id="coach" class="txt"></td></tr><tr><th>副監督</th><td><input id="assistantCoach" class="txt"></td><th>マネージャー</th><td><input id="manager" class="txt"></td></tr></table><table class="players"><thead><tr><th>背番号</th><th>選手氏名</th><th>年齢</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button onclick="saveLocal()">端末に保存</button><button onclick="makeShare()">共有リンク・QR作成</button><button class="alt" onclick="clearAll()">入力クリア</button></div><div id="share" class="share"><b>共有リンク</b><input id="shareUrl" readonly><div class="actions"><button onclick="copyLink()">リンクをコピー</button><button class="alt" onclick="nativeShare()">スマホで共有</button></div><div id="qr" class="qr"></div><div class="small">この試験版は入力内容を共有リンク内に保存します。リンクまたはQRを開くと同じ内容を表示できます。</div></div></div><script>const N=12,rows=document.getElementById('rows');for(let i=1;i<=N;i++){let tr=document.createElement('tr');tr.innerHTML=`<td><input id="no${i}" class="txt" inputmode="numeric"></td><td><input id="name${i}" class="txt"></td><td><input id="age${i}" class="txt" inputmode="numeric"></td>`;rows.appendChild(tr)}const ids=['address','responsible','phone','team','coach','assistantCoach','manager'];for(let i=1;i<=N;i++)ids.push('no'+i,'name'+i,'age'+i);function data(){let d={};ids.forEach(x=>d[x]=document.getElementById(x).value);d.category=document.querySelector('input[name=category]:checked').value;return d}function setData(d){ids.forEach(x=>{if(d[x]!=null)document.getElementById(x).value=d[x]});if(d.category){let r=[...document.querySelectorAll('input[name=category]')].find(x=>x.value===d.category);if(r)r.checked=true}}function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}function saveLocal(){localStorage.setItem('momiji-form',JSON.stringify(data()));alert('この端末に保存しました。')}function makeShare(){let u=new URL(location.href);u.hash='d='+encodeURIComponent(enc(data()));let s=u.toString();document.getElementById('shareUrl').value=s;document.getElementById('share').style.display='block';document.getElementById('qr').innerHTML='<img alt="QRコード" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(s)+'">';document.getElementById('share').scrollIntoView({behavior:'smooth'})}async function copyLink(){let s=document.getElementById('shareUrl').value;if(!s)return;try{await navigator.clipboard.writeText(s)}catch(e){let i=document.getElementById('shareUrl');i.select();document.execCommand('copy')}alert('リンクをコピーしました。')}async function nativeShare(){let s=document.getElementById('shareUrl').value||location.href;if(navigator.share)await navigator.share({title:'もみじ杯 参加申込書',url:s});else copyLink()}function clearAll(){if(!confirm('入力内容をすべて消しますか？'))return;ids.forEach(x=>document.getElementById(x).value='');document.querySelector('input[value="一般"]').checked=true;localStorage.removeItem('momiji-form')}(()=>{if(location.hash.startsWith('#d=')){try{setData(dec(decodeURIComponent(location.hash.slice(3))));return}catch(e){}}let s=localStorage.getItem('momiji-form');if(s)try{setData(JSON.parse(s))}catch(e){}})();</script></body></html>
