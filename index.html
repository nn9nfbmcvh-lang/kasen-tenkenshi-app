<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5f8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>河川点検士トレーニング</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>河川点検士トレーニング</h1>
  <div id="timer">90:00</div>
</header>
<main>
  <section id="login" class="card">
    <h2>パスワード入力</h2>
    <input id="passwordInput" type="password" inputmode="numeric" maxlength="8" placeholder="パスワード">
    <button onclick="unlockApp()">開始</button>
    <p class="note">初期パスワード：4151</p>
  </section>

  <section id="home" class="card hidden">
    <h2>学習モード</h2>
    <button onclick="startQuiz('all')">30問 模擬試験</button>
    <button onclick="startQuiz('random10')">ランダム10問</button>
    <button onclick="startQuiz('wrong')">間違い問題を復習</button>
    <button class="secondary" onclick="resetProgress()">学習履歴をリセット</button>
    <p id="stats"></p>
  </section>

  <section id="quiz" class="card hidden">
    <div class="topline"><span id="progress"></span><span id="category"></span></div>
    <div class="metaBox">
      <div id="difficulty"></div>
      <div id="trend"></div>
      <small>※想定出題傾向は公式公表値ではなく、学習優先度の目安です。</small>
    </div>
    <h2 id="question"></h2>
    <div id="choices"></div>
    <label class="reviewLabel"><input id="reviewCheck" type="checkbox" onchange="toggleReview()"> 後で見直す</label>
    <div id="questionNav" class="questionNav"></div>
    <button id="revealAnswerBtn" class="answerReveal hidden" onclick="revealAnswer()">回答を表示</button>
    <div id="feedback" class="hidden"></div>
    <div class="nav twoCol">
      <button id="prevBtn" class="secondary" onclick="previousQuestion()">前へ</button>
      <button id="nextBtn" onclick="nextQuestion()">次へ</button>
    </div>
    <button class="secondary" onclick="confirmFinish()">試験を終了して採点</button>
    <button class="endLearningBtn" onclick="confirmEndLearning()">学習を終了</button>
  </section>

  <section id="result" class="card hidden">
    <h2>結果</h2>
    <div id="score"></div>
    <div id="resultDetails"></div>
    <button id="retryWrongBtn" onclick="retryLastWrong()">間違えた問題だけ再出題</button>
    <button class="secondary" onclick="showHome()">ホームへ</button>
    <button class="endLearningBtn" onclick="showOutro()">学習を終了</button>
  </section>
</main>

<section id="introScreen" class="experienceScreen introScreen hidden" role="button" tabindex="0" aria-label="タップして問題画面へ">
  <img src="assets/launch.jpg" alt="机で河川点検士の勉強をする学生と犬">
  <div class="experienceShade"></div>
  <div class="speechBubble introBubble" aria-label="今日も一緒に、河川を見る目を鍛えよう！">
    <span id="introMessage" aria-hidden="true"></span><i class="typingCaret" aria-hidden="true"></i>
  </div>
  <div class="introTitle">
    <small>RIVER INSPECTION STUDY</small>
    <h2>河川点検士<br><em>合格するための500問</em></h2>
    <span>タップしてはじめる</span>
  </div>
</section>

<section id="outroScreen" class="experienceScreen outroScreen hidden">
  <img src="assets/finish.jpg" alt="休憩しながら飲み物を楽しむ犬">
  <div class="experienceShade"></div>
  <div class="speechBubble outroBubble">おつかれさま！ひと休みして、また挑戦しよう！</div>
  <button class="outroHomeBtn" onclick="returnFromOutro()">トップへ戻る</button>
</section>

<footer>オリジナル学習問題／公式試験問題ではありません</footer>
<script src="app.js"></script>
<script src="exam.js"></script>
</body>
</html>
