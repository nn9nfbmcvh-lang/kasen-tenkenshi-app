<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#103a36">
  <meta name="description" content="河川点検士試験の学習と模擬試験に対応したオフラインPWA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="河川点検士">
  <link rel="manifest" href="./manifest.webmanifest?v=1.3.5">
  <link rel="icon" href="./assets/icon.svg?v=1.3.5" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-180.png?v=1.3.5">
  <link rel="stylesheet" href="./styles.css?v=1.3.5">
  <title>河川点検士 — 問題演習</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-action="home" aria-label="ホームへ">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M8 11h24M7 20c7-5 10 5 17 0 4-3 6-2 9 0M7 28c7-5 10 5 17 0 4-3 6-2 9 0"/></svg>
        </span>
        <span><strong>河川点検士</strong><small>FIELD STUDY</small></span>
      </button>
      <div class="topbar-actions">
        <span class="offline-badge" id="networkBadge"><i></i><span>オンライン</span></span>
        <button class="icon-button" id="installButton" type="button" hidden aria-label="アプリをインストール">
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        </button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="メインナビゲーション">
      <button type="button" class="active" data-action="home">
        <svg viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9h-6v-6h-4v6H4Z"/></svg>
        <span>ホーム</span>
      </button>
      <button type="button" data-action="show-history">
        <svg viewBox="0 0 24 24"><path d="M4 19V9m6 10V5m6 14v-7m5 7H2"/></svg>
        <span>成績</span>
      </button>
      <button type="button" data-action="show-bookmarks">
        <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></svg>
        <span>見直し</span>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-root" id="modalRoot"></div>
  <script src="./photo-questions.js?v=1.3.5"></script>
  <script src="./questions.js?v=1.3.5"></script>
  <script src="./app.js?v=1.3.5"></script>
</body>
</html>
