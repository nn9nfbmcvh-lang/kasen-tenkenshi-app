<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5f8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>河川点検士トレーニング</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>河川点検士トレーニング</h1>
  <div id="timer">90:00</div>
</header>
<main>
  <section id="login" class="card">
    <h2>パスワード入力</h2>
    <input id="passwordInput" type="password" inputmode="numeric" maxlength="8" placeholder="パスワード">
    <button onclick="unlockApp()">開始</button>
    <p class="note">初期パスワード：4151</p>
  </section>
  <section id="home" class="card hidden">
    <h2>学習モード</h2>
    <button onclick="startQuiz('all')">30問 模擬試験</button>
    <button onclick="startQuiz('random10')">ランダム10問</button>
    <button onclick="startQuiz('wrong')">間違い問題を復習</button>
    <button class="secondary" onclick="resetProgress()">学習履歴をリセット</button>
    <p id="stats"></p>
  </section>

  <section id="quiz" class="card hidden">
    <div class="topline"><span id="progress"></span><span id="category"></span></div>
    <h2 id="question"></h2>
    <div id="choices"></div>
    <div id="feedback" class="hidden"></div>
    <div class="nav">
      <button id="nextBtn" class="hidden" onclick="nextQuestion()">次へ</button>
      <button class="secondary" onclick="quitQuiz()">終了</button>
    </div>
  </section>

  <section id="result" class="card hidden">
    <h2>結果</h2>
    <div id="score"></div>
    <button onclick="startQuiz('wrong')">間違い問題を復習</button>
    <button class="secondary" onclick="showHome()">ホームへ</button>
  </section>
</main>
<footer>オリジナル学習問題／公式試験問題ではありません</footer>
<script src="app.js"></script>
</body>
</html>
